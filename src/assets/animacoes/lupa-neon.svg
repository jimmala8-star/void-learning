
<svg xmlns="http://www.w3.org/2000/svg"
     width="400" height="300"
     viewBox="0 0 400 300">

  <circle
    cx="190"
    cy="125"
    r="75"
    fill="none"
    stroke="#0F52BA"
    stroke-width="7"
  />

  <line
  class="livro-neon"
    x1="245"
    y1="180"
    x2="310"
    y2="245"
    stroke="#0F52BA"
    stroke-width="12"
    stroke-linecap="round"
  />

<!-- Livro aberto -->
<path
class="livro-neon"
  d="M190 115 Q165 100 145 110 L145 155 Q170 145 190 160
     Q210 145 235 155 L235 110 Q215 100 190 115 Z"
  fill="none"
  stroke="#0F52BA"
  stroke-width="4"
  stroke-linejoin="round"
/>

<!-- Divisão central das páginas -->
<path
  d="M190 115 L190 160"
  fill="none"
  stroke="#38BDF8"
  stroke-width="3"
/>

<style>
  .luz-neon {
    fill: none;
    stroke: #38BDF8;
    stroke-width: 5;
    stroke-linecap: round;
    stroke-dasharray: 45 430;
    filter: drop-shadow(0 0 6px #0F52BA);
    animation: percorrer 4s linear infinite;
  }

  @keyframes percorrer {
    from {
      stroke-dashoffset: 475;
    }
    to {
      stroke-dashoffset: 0;
    }
  }
  
  .livro-neon {
    animation: brilho-livro 3s ease-in-out infinite;
  }

  @keyframes brilho-livro {
    0%, 100% {
      filter: drop-shadow(0 0 2px #0F52BA);
    }

    50% {
      filter: drop-shadow(0 0 10px #38BDF8);
    }
  }

</style>

<circle
  class="luz-neon"
  cx="190"
  cy="125"
  r="75"
/>

<!-- Brilho do conhecimento -->
<path
  class="livro-neon"
  d="M190 65 L194 76 L205 80 L194 84 L190 95 L186 84 L175 80 L186 76 Z"
  fill="#38BDF8"
/>

</svg>


